[package]
name = "secrets"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "Session-scoped secrets broker with hardware-gated grants"
repository = "https://github.com/sjawhar/secretsd"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "secrets"
path = "src/bin/secrets.rs"

[dependencies]
# No version fields on internal path deps: see deny.toml [bans] allow-wildcard-paths.
proto = { path = "../proto" }
containment = { path = "../containment" }
hygiene = { path = "../hygiene" }
# Syscalls: SO_PEERCRED, mlockall, prctl, openat.
nix = { workspace = true, features = ["socket", "mman", "process", "fs", "user", "signal", "poll", "term", "resource"] }
# Wipe plaintext on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
# Structured logging to stderr; journald captures it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Constant-time comparison for session tokens.
subtle = "2"
# Config parsing only. Config carries directory paths, never secret values,
# so serde is acceptable here; the plaintext-path ban below still stands.
toml = { version = "1.1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
# Mode-0600 temp files for the new-secret creation flow: the editor needs a
# plaintext file, and the ciphertext is staged before being renamed into place.
tempfile = "3"
# Command-line grammar, help text, and shell completions. Argument parsing
# only -- secret plaintext never passes through clap.
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.1"

[dev-dependencies]
proptest = "1"

# NOTE: deliberately NO serde / dotenv crate on the plaintext path. Secret
# plaintext must never pass through a general-purpose (de)serializer's internal
# buffers, which we cannot zeroize. The wire protocol is hand-rolled in
# `src/proto.rs` and secret bytes are written straight from a zeroizing buffer
# to the socket. `src/config.rs` parses the source-roots TOML with serde; it
# carries paths, never secrets.

[lints]
workspace = true
