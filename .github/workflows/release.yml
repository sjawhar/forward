name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
          if [[ -n "$latest_tag" ]]; then
            current="${latest_tag#v}"
            commit_range="${latest_tag}..HEAD"
          else
            current="$(grep -m 1 '^version = "' Cargo.toml | cut -d '"' -f 2)"
            commit_range="HEAD"
          fi

          commits="$(git log "$commit_range" --format='%B')"
          if [[ -z "$commits" ]]; then
            echo "No commits to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects="$(git log "$commit_range" --format='%s')"
          bump=""
          if grep -Eq '^[a-z]+(\(.+\))?!:' <<< "$subjects" || grep -Fq 'BREAKING CHANGE' <<< "$commits"; then
            bump="major"
          elif grep -Eq '^feat(\(.+\))?:' <<< "$subjects"; then
            bump="minor"
          elif grep -Eq '^(fix|refactor|perf)(\(.+\))?:' <<< "$subjects"; then
            bump="patch"
          else
            echo "No conventional commits require a release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            patch) version="${major}.${minor}.$((patch + 1))" ;;
          esac

          printf 'Bumping %s → %s\n' "$current" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [version, quality]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          grep -Fx "version = \"$VERSION\"" Cargo.toml

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          # Each cross container gets its own target dir, as ci.yml's cross jobs
          # and the previous release workflow do. Sharing one rust-cache-restored
          # target/ across both containers left the aarch64 build resolving stale
          # host proc-macro artifacts (E0463 on zerofrom_derive) in this
          # workflow's first run.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            export CARGO_TARGET_DIR="target/cross-$target"
            cross build --locked --release --target "$target"
            tar -czf "forward-$target.tar.gz" -C "$CARGO_TARGET_DIR/$target/release" forward
            tar -tzf "forward-$target.tar.gz" | grep -Fx forward
          done

      - name: Attest x86_64 archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: forward-x86_64-unknown-linux-musl.tar.gz

      - name: Attest aarch64 archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: forward-aarch64-unknown-linux-musl.tar.gz

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: forward-*-unknown-linux-musl.tar.gz

  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Commit release version and tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          grep -Fx "version = \"$VERSION\"" Cargo.toml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v${VERSION}" release-assets/forward-*-unknown-linux-musl.tar.gz --generate-notes
