name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release this bump from the current main, when the commit rule missed one.
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        env:
          FORCE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || '' }}
        run: |
          set -euo pipefail

          # One version for both binaries, read from [workspace.package].
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
          if [[ -n "$latest_tag" ]]; then
            current="${latest_tag#v}"
            commit_range="${latest_tag}..HEAD"
            diff_base="$latest_tag"
          else
            current="$(grep -m 1 '^version = "' Cargo.toml | cut -d '"' -f 2)"
            commit_range="HEAD"
            diff_base="$(git hash-object -t tree /dev/null)"
          fi

          if [[ -n "$FORCE_BUMP" ]]; then
            # The escape hatch for whatever the rule below still gets wrong: a
            # human ran this workflow by hand and named the bump. It must come
            # from main, because the release job tags main while the build job
            # archives and attests the dispatched ref -- from any other branch
            # the published tag and the attested binaries disagree.
            if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
              printf 'A forced release must be dispatched from main, not %s\n' "${GITHUB_REF:-an unknown ref}" >&2
              exit 1
            fi
            bump="$FORCE_BUMP"
            printf 'Forced %s release requested by hand\n' "$bump"
          else
            commits="$(git log "$commit_range" --format='%B')"
            if [[ -z "$commits" ]]; then
              echo "No commits to release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            subjects="$(git log "$commit_range" --format='%s')"
            # The same subjects without the merge commits, which describe an
            # integration rather than work of their own.
            authored="$(git log "$commit_range" --no-merges --format='%s')"
            # Subjects that declare work which does not ship on its own. The
            # "chore: release vX" commit this workflow pushes is one of them.
            no_release='^(build|chore|ci|style|test)(\(.+\))?:'
            # An unreadable base aborts the step here rather than reading as
            # "nothing changed": releasing nothing is never the quiet answer.
            changed="$(git diff --name-only "$diff_base" HEAD)"

            if grep -Eq '^[a-z]+(\(.+\))?!:' <<< "$subjects" || grep -Fq 'BREAKING CHANGE' <<< "$commits"; then
              bump="major"
            elif grep -Eq '^feat(\(.+\))?:' <<< "$subjects"; then
              bump="minor"
            elif grep -Eq '^(fix|refactor|perf)(\(.+\))?:' <<< "$subjects"; then
              bump="patch"
            elif [[ -n "$authored" && -n "$changed" ]] && grep -Evq "$no_release" <<< "$authored"; then
              # Work whose subject claimed no bump still ships. #68 merged as
              # "using-secrets: a diagnostic that crashes is the leak", this
              # workflow went green, released nothing, and every session kept
              # reading the superseded skill: a consumer reaches the binaries,
              # the plugin, the units and the skills only through a tag, so a
              # subject deciding on its own is what failed. Opting out stays
              # explicit, and these three ranges still release nothing: every
              # non-merge subject declared no-release work, no non-merge
              # commit at all, or a net diff of nothing (an edit and its
              # revert).
              bump="patch"
            else
              echo "No commits require a release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            patch) version="${major}.${minor}.$((patch + 1))" ;;
          esac

          printf 'Bumping %s → %s\n' "$current" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [version, quality]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Both crates inherit version.workspace, so this one rewrite covers them.
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          grep -Fx "version = \"$VERSION\"" Cargo.toml

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build forward archives (musl, per target)
        shell: bash
        run: |
          set -euo pipefail
          # Each cross container gets its own target dir: sharing one
          # rust-cache-restored target/ across containers left the aarch64 build
          # resolving stale host proc-macro artifacts (E0463).
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            export CARGO_TARGET_DIR="target/cross-$target"
            cross build --locked --release -p forward --target "$target"
            tar -czf "forward-$target.tar.gz" -C "$CARGO_TARGET_DIR/$target/release" forward
            tar -tzf "forward-$target.tar.gz" | grep -Fx forward
          done

      - name: Build secrets archive (native glibc)
        shell: bash
        run: |
          set -euo pipefail
          # The broker stays a native glibc build: it depends on mlockall and
          # pidfd behaviour that a static musl build would change.
          cargo build --locked --profile secrets-release -p secrets
          # Version-free, and named like forward's own two archives. mise
          # selects this asset by an exact `asset_pattern` against a `latest`
          # release, which a version-stamped name would force to be a glob.
          staging="secrets-x86_64-unknown-linux-gnu"
          mkdir -p "$staging/bin" "$staging/share/secretsd/opencode/plugins" \
                   "$staging/share/secretsd/skills/using-secrets" "$staging/systemd"
          install -m 0755 target/secrets-release/secrets "$staging/bin/secrets"
          install -m 0644 opencode/plugins/secretsd.ts "$staging/share/secretsd/opencode/plugins/secretsd.ts"
          install -m 0644 skills/using-secrets/SKILL.md "$staging/share/secretsd/skills/using-secrets/SKILL.md"
          install -m 0644 systemd/secretsd.service "$staging/systemd/secretsd.service"
          install -m 0644 systemd/secretsd.socket "$staging/systemd/secretsd.socket"
          tar czf "${staging}.tar.gz" "$staging"

          # The installer reads these paths out of the archive; a missing one
          # fails at install time on the devbox instead of here.
          for artifact in \
            "$staging/bin/secrets" \
            "$staging/share/secretsd/opencode/plugins/secretsd.ts" \
            "$staging/share/secretsd/skills/using-secrets/SKILL.md" \
            "$staging/systemd/secretsd.service" \
            "$staging/systemd/secretsd.socket"; do
            tar --list --gzip --file="${staging}.tar.gz" \
              | grep --fixed-strings --line-regexp -- "$artifact" >/dev/null \
              || { printf 'release archive is missing: %s\n' "$artifact" >&2; exit 1; }
          done

      - name: Attest forward x86_64 archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: forward-x86_64-unknown-linux-musl.tar.gz

      - name: Attest forward aarch64 archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: forward-aarch64-unknown-linux-musl.tar.gz

      - name: Attest secrets archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: secrets-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            forward-*-unknown-linux-musl.tar.gz
            secrets-x86_64-unknown-linux-gnu.tar.gz

  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Commit release version and tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          # The opencode plugin speaks a versioned protocol to the broker, so it
          # carries the same version and ships in the same release.
          sed -i '0,/"version": ".*"/s//"version": "'"$VERSION"'"/' package.json
          cargo update --workspace
          grep -Fx "version = \"$VERSION\"" Cargo.toml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock package.json
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum ./*.tar.gz > ../SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release-assets/forward-*-unknown-linux-musl.tar.gz \
            release-assets/secrets-x86_64-unknown-linux-gnu.tar.gz \
            SHA256SUMS \
            --generate-notes
