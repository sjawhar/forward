[workspace]
members = ["crates/containment", "crates/forward", "crates/hygiene", "crates/proto", "crates/secrets"]
resolver = "3"

# One tag releases both binaries, so they share one version. The line continues
# from the secrets broker's 2.6.0: taking forward's 0.6.1 forward instead would
# regress a published version and confuse the installer's version gating.
[workspace.package]
version = "3.0.1"
edition = "2024"

# One `nix` for the whole workspace. Two majors used to link into one binary:
# forward on 0.31 while the credential-path crates sat on 0.29, so a RUSTSEC
# fix against 0.29 would have looked resolved after bumping forward alone.
# 0.31 also surfaces `SO_PEERPIDFD`, which is what let containment delete its
# hand-rolled `getsockopt` block. Crates keep their own feature lists: those
# document what each one actually uses, and the MSRV job builds them alone.
[workspace.dependencies]
nix = { version = "0.31", default-features = false }

# Profiles are workspace-root-only in Cargo, and `panic` cannot be overridden
# per package. Abort is deliberate: secretsd swallows mutex poisoning
# (`PoisonError::into_inner`) across its worker pool, which is only sound while
# a panic can never leave a poisoned lock behind. forward's supervision sites
# only logged and exited, so abort costs it nothing.
[profile.release]
opt-level = 3
strip = "symbols"
panic = "abort"
debug = "line-tables-only"

# secretsd's release shape, kept off forward's builds: fat LTO with one codegen
# unit lengthens linking, and forward cross-compiles to two targets.
[profile.secrets-release]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"

[profile.miri]
inherits = "test"
opt-level = 1
overflow-checks = true

# Hoisted from the secrets crate, which had the stricter set. Shared crates and
# crates/secrets opt in via `[lints] workspace = true`. Never relaxed to
# accommodate the move: forward opts in as its own change once it lands clean.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Two `syn` majors are in the tree transitively: clap/serde/thiserror derive
# macros are on 3.x while url's idna -> displaydoc chain is still on 2.x.
# Neither is a direct dependency, so this is not actionable here; `cargo deny`
# still reports it (multiple-versions = "warn") so it stays visible.
multiple_crate_versions = "allow"

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "deny"
print_stdout = "deny"
use_debug = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

mod_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enums = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
